theme-btn');const s=localStorage.getItem('theme');if(s==='sombre'){document.body.classList.add('sombre');b.textContent='☀️ Mode Clair'}b.onclick=()=>{document.body.classList.toggle('sombre');const d=document.body.classList.contains('sombre');b.textContent=d?'☀️ Mode Clair':'🌙 Mode Sombre';localStorage.setItem('theme',d?'sombre':'clair')}</script></body></html>
